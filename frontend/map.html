<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>نەخشەی کێشەکان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --bg: #17181c;
    --card: #1f2127;
    --border: #33363f;
    --text: #f2f2f4;
    --text-dim: #9a9ca6;
    --text-mute: #6f7280;
    --accent: #3b6dee;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Kufi Arabic', 'Segoe UI', Tahoma, sans-serif;
  }
  body { display: flex; flex-direction: column; }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    z-index: 500;
    background: var(--bg);
  }
  h1 { font-size: 18px; margin: 0; }
  .top-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 16px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  #map { flex: 1; width: 100%; background: var(--bg); }

  .legend {
    position: absolute;
    bottom: 18px;
    right: 12px;
    background: rgba(31,33,39,0.92);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 12px;
    color: var(--text-dim);
    z-index: 500;
    line-height: 2;
  }
  .legend-title { color: var(--text); font-weight: 700; margin-bottom: 4px; }
  .legend-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-left: 6px;
    vertical-align: middle;
  }

  .empty-note {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(31,33,39,0.95);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 22px;
    font-size: 13.5px;
    color: var(--text-dim);
    z-index: 500;
    display: none;
  }

  /* popup content */
  .popup-wrap { font-family: 'Noto Kufi Arabic', 'Segoe UI', Tahoma, sans-serif; direction: rtl; min-width: 200px; }
  .popup-photo { width: 100%; max-height: 140px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; display: block; }
  .popup-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: #444; margin: 3px 0; }
  .popup-row b { color: #111; }
  .popup-summary { font-size: 12.5px; color: #222; margin-top: 6px; line-height: 1.5; }
  .popup-time { font-size: 11px; color: #888; margin-top: 6px; }
  .popup-sev {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
  }

  .leaflet-popup-content-wrapper { border-radius: 12px; }
</style>
</head>
<body>
  <div class="top">
    <div>
      <h1>🗺️ نەخشەی کێشەکان</h1>
      <div class="top-sub" id="top-sub">بارکردن...</div>
    </div>
    <a class="btn primary" href="index.html">📸 ڕاپۆرتکردنی کێشەیەکی نوێ</a>
  </div>

  <div id="map"></div>
  <div class="empty-note" id="empty-note">هێشتا هیچ ڕاپۆرتێکی شوێندار نییە</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="common.js"></script>
<script>
// Sulaymaniyah city center - used as the default view when there's nothing
// (or nothing yet) to fit bounds to.
const DEFAULT_CENTER = [35.5608, 45.4347];
const DEFAULT_ZOOM = 13;

const SEVERITY_COLORS = { 1: "#2fbf71", 2: "#8bc34a", 3: "#d9a441", 4: "#e08a3c", 5: "#e24b4b" };
const DEFAULT_COLOR = "#3b6dee"; // reports not yet AI-triaged

let categoryLabels = {};

const map = L.map("map", { zoomControl: true }).setView(DEFAULT_CENTER, DEFAULT_ZOOM);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);

const legend = L.control({ position: "bottomright" });
legend.onAdd = function () {
  const div = L.DomUtil.create("div", "legend");
  div.innerHTML = `
    <div class="legend-title">ئاستی گرنگی (AI)</div>
    ${[5, 4, 3, 2, 1].map((n) => `<div><span class="legend-dot" style="background:${SEVERITY_COLORS[n]}"></span>${n}</div>`).join("")}
    <div><span class="legend-dot" style="background:${DEFAULT_COLOR}"></span>شیکارنەکراو</div>
  `;
  return div;
};
legend.addTo(map);

function fmtTime(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString("en-GB", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  } catch (e) { return iso; }
}

function markerColor(r) {
  if (r.ai_status === "done" && r.severity) return SEVERITY_COLORS[r.severity] || DEFAULT_COLOR;
  return DEFAULT_COLOR;
}

function buildPopup(r) {
  // Everything below that came from a citizen or the AI goes through esc() -
  // location names and summaries are free text and must never be treated as HTML.
  const categoryLabel = r.category ? (categoryLabels[r.category] || r.category) : "پۆلێنی نەکراو";
  const photoUrl = mediaUrl(r.photo_path);
  const photo = photoUrl
    ? `<img class="popup-photo" src="${esc(photoUrl)}" alt="" onerror="this.style.display='none'">`
    : "";
  const sev = (r.ai_status === "done" && r.severity)
    ? `<span class="popup-sev" style="background:${markerColor(r)}22; color:${markerColor(r)};">${esc(r.severity)}/5</span>`
    : `<span class="popup-sev" style="background:#eee; color:#888;">چاوەڕوان</span>`;
  const summary = r.ai_summary ? `<div class="popup-summary">🤖 ${esc(r.ai_summary)}</div>` : "";
  const mapsUrl = `https://www.google.com/maps?q=${num(r.lat)},${num(r.lng)}`;

  return `
    <div class="popup-wrap">
      ${photo}
      <div class="popup-row"><span>جۆر</span><b>${esc(categoryLabel)}</b></div>
      <div class="popup-row"><span>گرنگی</span>${sev}</div>
      ${r.department ? `<div class="popup-row"><span>بەش</span><b>${esc(r.department)}</b></div>` : ""}
      <div class="popup-row"><span>شوێن</span><b>${esc(r.location_label) || "—"}</b></div>
      ${summary}
      <div class="popup-time">${esc(fmtTime(r.created_at))} · <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer">Google Maps</a></div>
    </div>`;
}

async function loadCategoryLabels() {
  try {
    const res = await fetch("/api/config");
    const data = await res.json();
    categoryLabels = data.categories || {};
  } catch (e) {
    categoryLabels = {};
  }
}

function focusIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const v = params.get("focus");
  return v ? parseInt(v, 10) : null;
}

async function loadReports() {
  const res = await fetch("/api/map");
  if (!res.ok) throw new Error("map data request failed: " + res.status);
  const data = await res.json();
  const withLocation = data.reports.filter((r) => r.lat != null && r.lng != null);

  document.getElementById("top-sub").textContent =
    `${withLocation.length} لە ${data.total} ڕاپۆرت شوێنیان دیارە`;

  if (!withLocation.length) {
    document.getElementById("empty-note").style.display = "block";
    return;
  }

  const markers = [];
  const focusId = focusIdFromUrl();
  let focusMarker = null;

  withLocation.forEach((r) => {
    const marker = L.circleMarker([r.lat, r.lng], {
      radius: 9,
      color: "#17181c",
      weight: 1.5,
      fillColor: markerColor(r),
      fillOpacity: 0.9,
    }).addTo(map);
    marker.bindPopup(buildPopup(r), { maxWidth: 260 });
    markers.push(marker);
    if (focusId && r.id === focusId) focusMarker = marker;
  });

  if (focusMarker) {
    map.setView(focusMarker.getLatLng(), 17);
    focusMarker.openPopup();
  } else {
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.15), { maxZoom: 16 });
  }
}

(async function init() {
  await loadCategoryLabels();
  try {
    await loadReports();
  } catch (e) {
    console.error(e);
    document.getElementById("top-sub").textContent = "هەڵەیەک ڕوویدا لە بارکردنی ڕاپۆرتەکان";
  }
})();
</script>
</body>
</html>
