# Render "Blueprint" — lets Render create the web service straight from this
# repo with the right settings pre-filled (New -> Blueprint in the Render
# dashboard, point it at your GitHub repo). You still add the DATABASE_URL
# env var yourself after creating a free Postgres DB (Supabase or similar) —
# see README.md, "Publish it (a real public URL)".
services:
  - type: web
    name: suli-report-form
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      # Supabase Storage - keeps uploaded photos/voice recordings persistent
      # across restarts/redeploys (Render's free-tier local disk is wiped on
      # both). Set these to your Supabase project's URL and service_role key
      # (Project Settings -> API Keys -> Legacy anon, service_role API keys).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: media
      # AI triage (backend/ai.py) - without this, every report still saves
      # normally, it just gets ai_status="unavailable" and no category/
      # severity/summary/department. Get a key at console.anthropic.com.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Locks the dashboard data / CSV export / re-triage / media re-attach
      # endpoints behind an X-Admin-Token header (the dashboard asks for it).
      # Use a long random string. Unset = those endpoints are open to anyone
      # with the URL (see README.md, "Your dashboard").
      - key: ADMIN_TOKEN
        sync: false
